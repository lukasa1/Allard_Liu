stories:
  bilateral knee condition:
    h02: Both knees ache and grind, and the right one locks up sometimes.
    h03: Stairs are hard, and I can't kneel at all.
    h04: It built up over years of foot patrols and ruck marches in service.
    h05: Every day.
    h06: It has gotten worse since I got out.
    h07: Kandahar Province, Afghanistan, and Fort Campbell, Kentucky.
    h08: On foot patrols and in training.
    h09: Heavy rucks, body armor, rough ground and jumping off vehicles.
    h10: No single injury - years of carrying a lot of weight.
    h11: Yes, I went to sick call a few times and was given Motrin and a knee sleeve.
    h12: I had to leave a warehouse job because of the standing; now I work a desk job at a call center.
    h13: I miss a day or two a month when they swell.
    h14: I can't play basketball or walk long distances anymore.
    h15: My knees were fine before the Army.
    h16: No.
