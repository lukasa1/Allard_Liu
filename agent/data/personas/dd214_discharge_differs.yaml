id: dd214_discharge_differs
split: heldout  # not fixed against directly (see intake_eval/evaluate.py NOTES['split'])
summary: The veteran says their discharge was honorable, but the DD-214 in the C-file says general (under
  honorable conditions). The DD-214 wins on discharge - prefill records general and a staff task
  notes the difference (scored in the cfile condition). General is not a stop rule, so the case stays eligible
  and reaches stage 5 (ready for attorney review).
behaviors:
- If asked how you heard about the firm, say you found it on the internet; say where only when asked where.
- "You are sure your discharge was honorable and say so plainly when asked, without hedging. Don't bring up
  your DD-214. If the assistant tells you the DD-214 shows a different discharge, say you didn't know that and
  it may well be right."
