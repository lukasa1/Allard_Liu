stories:
  bilateral hearing loss:
    h02: I can't follow conversations in noisy rooms and I turn the TV way up.
    h03: In a crowded room I just nod along because I can't make out what people say.
    h04: It came on gradually during service, around my deployment in 2010.
    h05: All the time.
    h06: It's slowly gotten worse since I got out.
    h07: Bagram Airfield, Afghanistan.
    h08: On the flight line of a base.
    h09: Jet engines running all day, and we didn't always have good ear protection.
    h10: Loading munitions next to running jets for years.
    h11: No, I just figured everyone on the flight line had bad hearing.
    h12: I work at a bank and phone calls with customers are hard.
    h13: I don't miss work, but I make mistakes when I mishear numbers.
    h14: I've stopped going to family dinners at restaurants.
    h15: My hearing was normal before the Air Force.
    h16: No.
