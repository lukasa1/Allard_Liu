stories:
  bilateral hearing loss:
    h02: I can't hear people unless they face me, and the TV has to be loud.
    h03: In a group I miss most of the conversation.
    h04: It came on during service, along with the ringing that VA already rated.
    h05: All the time.
    h06: It's gotten worse since my last VA exam.
    h07: Camp Taji, Iraq.
    h08: In vehicles, on convoys.
    h09: Engine noise, gunfire and blasts.
    h10: Years of convoy and weapons noise without good protection.
    h11: Yes, my hearing test at separation showed a drop.
    h12: I misunderstand customers at work and it's embarrassing.
    h13: No missed work.
    h14: I've stopped going to family dinners because I can't follow.
    h15: My hearing was normal when I enlisted.
    h16: My old lawyer filed for my PTSD and the ringing, but never for the hearing loss.
