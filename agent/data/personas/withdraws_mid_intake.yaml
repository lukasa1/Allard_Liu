id: withdraws_mid_intake
summary: Partway through screening, before anything is signed, the veteran says they want to stop, in words
  code's withdrawal check misses (a test asserts it), so the message reaches intake. Intake's model must hand
  the case to a person (to_person); code sends the withdrawal message and the case ends at needs_human
  (every withdrawal goes to a person, who confirms it before anything changes).
asks:
  at_reply: 3
  expects: person  # not a question for the KB: no kb_search check, no answer key
  text: "I've changed my mind, let's forget the whole thing."
behaviors:
- "Until the moment you say you've changed your mind, answer normally. After you say you want to stop, stick with it: if the assistant asks, confirm in the same kind of words
  you used, e.g. 'I don't want to go ahead'. Don't mention the case, the firm's help or services, or
  representation, and don't use words like cancel, revoke, end or withdraw."
