id: colloquial_conditions
summary: Describes every condition in everyday words that are not in the code's synonym table
  (agent/intake/conditions.py), so the model itself must turn them into the VA-style names.
  Keep the phrases (and the stories' wording) out of that table.
behaviors:
- colloquial_conditions
says:
  tinnitus: my ears buzz all the time
  lumbar strain: my spine's been wrecked since that fall
  sleep apnea: my wife says I quit breathing in my sleep
truth:
  first_name: Kevin
  last_name: Doyle
  claim_conditions:
  - tinnitus
