stories:
  tinnitus:
    h02: A constant ringing in both ears, louder at night.
    h03: When it's bad I can't follow a conversation or get to sleep.
    h04: It started in 1991, on convoys into Kuwait during Desert Storm.
    h05: Every day.
    h06: It never went away, and it's gotten worse over the years.
    h07: Kuwait and southern Iraq.
    h08: Driving trucks in convoys.
    h09: Diesel engines all day, artillery firing nearby, no real hearing protection.
    h10: An artillery battery firing right next to our convoy in February 1991.
    h11: No, nobody reported ringing ears back then.
    h12: I manage a parts counter now and I keep asking customers to repeat themselves.
    h13: I haven't missed work for it.
    h14: I avoid restaurants and I can't hear my grandkids well.
    h15: My hearing was fine before the Army.
    h16: No.
