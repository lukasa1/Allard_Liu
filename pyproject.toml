[project]
name = "poa-agent"
version = "0.1.0"
description = "Intake-agent skill: securely capture veteran data, fill VA Form 21-22a, and click-to-sign."
requires-python = ">=3.12"
dependencies = [
    "pypdf>=5.0",
    "reportlab>=4.0",
    "pillow>=10.0",
    "cryptography>=43.0",
    "openai>=1.50",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["poa_skill"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
