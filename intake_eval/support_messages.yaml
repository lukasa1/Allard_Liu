- {phase: attorney_review, text: "Thanks!", flags: [], status: false, person: true}
- {phase: attorney_review, text: "ok", flags: [], status: false, person: true}
- {phase: attorney_review, text: "I don't want to be here anymore. I've been thinking about ending it.", flags: [], status: false, person: true, crisis: true}
- {phase: attorney_review, text: "Some days I think about killing myself.", flags: [], status: false, person: true, crisis: true}
- {phase: closed, text: "Why was my case closed?", flags: [], status: true, person: false}
- {phase: closed, text: "Any update?", flags: [], status: true, person: false}
