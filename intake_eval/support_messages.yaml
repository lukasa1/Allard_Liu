- {phase: attorney_review, text: "I don't want you to represent me anymore.", flags: [withdraw], status: false, person: true}
- {phase: attorney_review, text: "Please cancel my case.", flags: [withdraw], status: false, person: true}
- {phase: attorney_review, text: "This is ridiculous, nobody has called me in two weeks.", flags: [complaint], status: false, person: true}
