# Labeled messages for the customer-support sub-agent (agent/support/), sent to a case no owner is
# working (intake_eval/support_eval.py).
# Synthetic. Each entry:
#   phase    attorney_review | closed | human_handoff   (the case that receives it: stage 5 with
#            nobody working it, closed, needs_human)
#   text     what the veteran types
#   flags    what must be raised: new_condition, contact_change, complaint (support's flags) or
#            withdraw, wants_human (code's by-rule hand-off)
#   status   true if the reply must give the case status
#   person   true if a staff task must be created (a person reads it)
#   crisis   true if it must get the crisis message and an immediate hand-off
#   backstop true for a crisis message code's check misses (a test asserts it), so support's
#            crisis_to_person must catch it
#   escalate true if, besides a flag, support must also escalate (a flag plus a question only a
#            person may answer). Every message to a human_handoff case must be escalated (the
#            skill: a person already has the case), so those need no label.
#   kb       true for a general VA question support must look up with kb_search (answer-questions
#            rule 2). If kb_search finds no answer, the skill says escalate: then a person is right.
#   core_subset  question | status | complaint | change: the 50-message core set
#                (30 questions, 10 status checks, 5 complaints, 5 that would change the case)
- {phase: attorney_review, text: "Any news on my file?", flags: [], status: true, person: false, core_subset: status}
- {phase: attorney_review, text: "Any news on my file? And do I owe you anything yet?", flags: [], status: true, person: false}
