# Labeled messages for the customer-support subagent (agent/support.py), sent to a parked case.
# Synthetic. Each entry:
#   phase    attorney_review | closed | human_handoff   (which parked case receives it)
#   text     what the veteran types
#   flags    flags support must raise (new_condition, withdraw, contact_change, complaint, wants_human)
#   status   true if the reply must give the case status
#   person   true if a staff task must be created (a person reads it)
#   crisis   true if it must get the crisis message and an immediate hand-off
- {phase: attorney_review, text: "Any news on my file?", flags: [], status: true, person: false}
- {phase: attorney_review, text: "Any news on my file? And do I owe you anything yet?", flags: [], status: true, person: false}
- {phase: attorney_review, text: "What happens next?", flags: [], status: true, person: false}
- {phase: attorney_review, text: "Where is my case at?", flags: [], status: true, person: false}
- {phase: attorney_review, text: "How's my claim going?", flags: [], status: true, person: false}
- {phase: attorney_review, text: "What is an intent to file?", flags: [], status: false, person: false}
- {phase: attorney_review, text: "How long does a higher-level review take?", flags: [], status: false, person: false}
- {phase: attorney_review, text: "What is a C-file?", flags: [], status: false, person: false}
- {phase: attorney_review, text: "Can I revoke the 21-22a later if I want?", flags: [], status: false, person: false}
- {phase: attorney_review, text: "Do you charge anything up front?", flags: [], status: false, person: false}
- {phase: attorney_review, text: "What rating will I get for my back?", flags: [], status: false, person: true}
- {phase: attorney_review, text: "Should I go to my C&P exam?", flags: [], status: false, person: true}
